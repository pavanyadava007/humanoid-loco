[project]
name = "humanoid-loco"
version = "0.1.0"
description = "Unitree G1 joystick locomotion with MuJoCo Playground (MJX) PPO, domain randomization and CPU MuJoCo sim-to-sim evaluation"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", ".jax_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
